about_content: | # this will include new lines to allow paragraphs
  Hi, I'm Kato — a Petroleum Engineering graduate (B.Sc.) and current M.Sc. candidate at China University of Petroleum (Beijing), working on reservoir simulation, hydraulic fracturing optimization, and geomechanics. I'm skilled in reservoir simulation software (PETREL, GOHFER 3D), machine learning with Python, and database management (MySQL), and I bring professional experience in logistics coordination and supply chain optimization.

  Trilingual in English, Mandarin, and Swahili, with experience in international collaboration and cross-cultural communication.

